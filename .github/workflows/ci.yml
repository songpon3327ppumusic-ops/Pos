name: StoreFlow build check

on:
  push:
    branches: ["feature/live-supabase-data"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Dependency security audit
        run: npm audit --audit-level=high
      - name: Build static app
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://tjunaxajcxwxirneopar.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_wVEx-RyoXNTZTmVHt935Pw_CCf3ZQuB
