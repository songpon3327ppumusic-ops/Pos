name: StoreFlow build check

on:
  push:
    branches: ["feature/live-supabase-data"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build static app
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://tjunaxajcxwxirneopar.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_wVEx-RyoXNTZTmVHt935Pw_CCf3ZQuB
