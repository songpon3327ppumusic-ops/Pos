name: Build StoreFlow Android

on:
  push:
    branches:
      - "**"
    paths:
      - "android/**"
      - ".github/workflows/build-android.yml"
  pull_request:
    branches:
      - "**"
    paths:
      - "android/**"
      - ".github/workflows/build-android.yml"
  workflow_dispatch:
    inputs:
      build_release:
        description: "Also build signed Release AAB (requires signing secrets)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK and optional AAB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Generate Gradle Wrapper
        working-directory: android
        run: |
          for attempt in 1 2 3; do
            gradle wrapper --gradle-version 8.13 --distribution-type bin && exit 0
            echo "Gradle wrapper generation failed (attempt $attempt/3); retrying after 20 seconds..."
            sleep 20
          done
          exit 1

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Build debug APK
        working-directory: android
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          for attempt in 1 2 3; do
            ./gradlew --no-daemon assembleDebug && exit 0
            echo "Android build failed (attempt $attempt/3); retrying after 20 seconds..."
            sleep 20
          done
          exit 1

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: storeflow-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Decode Android signing keystore
        if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/feature/android-native-storeflow') || (github.event_name == 'workflow_dispatch' && inputs.build_release) }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "Missing ANDROID_KEYSTORE_BASE64 secret" && exit 1)
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/storeflow-release.jks"

      - name: Build signed Release AAB
        if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/feature/android-native-storeflow') || (github.event_name == 'workflow_dispatch' && inputs.build_release) }}
        working-directory: android
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/storeflow-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_PASSWORD" && test -n "$ANDROID_KEY_ALIAS" && test -n "$ANDROID_KEY_PASSWORD"
          ./gradlew --no-daemon bundleRelease

      - name: Upload Release AAB
        if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/feature/android-native-storeflow') || (github.event_name == 'workflow_dispatch' && inputs.build_release) }}
        uses: actions/upload-artifact@v4
        with:
          name: storeflow-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
