name: Build StoreFlow Android

on:
  push:
    branches:
      - "**"
    paths:
      - "android/**"
      - ".github/workflows/build-android.yml"
  pull_request:
    branches:
      - "**"
    paths:
      - "android/**"
      - ".github/workflows/build-android.yml"
  workflow_dispatch:
    inputs:
      build_release:
        description: "Also build signed Release AAB (requires signing secrets)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK and optional AAB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Build debug APK
        working-directory: android
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          for attempt in 1 2 3; do
            gradle --no-daemon assembleDebug && exit 0
            echo "Android build failed (attempt $attempt/3); retrying after 20 seconds..."
            sleep 20
          done
          exit 1

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: storeflow-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Decode Android signing keystore
        id: signing
        if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/feature/android-native-storeflow') || (github.event_name == 'workflow_dispatch' && inputs.build_release) }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Release signing is not configured; debug APK will still be available."
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/storeflow-release.jks"
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Build signed Release APK and AAB
        if: ${{ steps.signing.outputs.available == 'true' && ((github.event_name == 'push' && github.ref == 'refs/heads/feature/android-native-storeflow') || (github.event_name == 'workflow_dispatch' && inputs.build_release)) }}
        working-directory: android
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/storeflow-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_PASSWORD" && test -n "$ANDROID_KEY_ALIAS" && test -n "$ANDROID_KEY_PASSWORD"
          gradle --no-daemon assembleRelease bundleRelease

      - name: Upload signed Release APK
        if: ${{ steps.signing.outputs.available == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: storeflow-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Release AAB
        if: ${{ steps.signing.outputs.available == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: storeflow-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
